[build]
  publish = "dist"
  command = "npm run build"

# Proxy de llamadas API hacia el backend en Render
# Reemplazar la URL por la URL pública que te asigne Render al crear el Web Service
[[redirects]]
  from = "/api/*"
  to = "https://hotel-backend-bmod.onrender.com"
  status = 200
  force = true

# Redirección SPA para evitar errores 404 al recargar la página en Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
