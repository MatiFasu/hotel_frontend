[build]
  publish = "dist"
  command = "npm run build"

# Proxy de llamadas API hacia el backend en Render
# :splat pasa la ruta exacta que viene después de /api/ (ej. /api/auth/login -> https://.../api/auth/login)
[[redirects]]
  from = "/api/*"
  to = "https://hotel-backend-bmod.onrender.com/api/:splat"
  status = 200
  force = true

# Redirección SPA para evitar errores 404 al recargar la página en Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
